[project]
name = "notron-service"
version = "0.1.0"
description = "Account-scoped Notron managed service"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "psycopg[binary]==3.3.5",
  "uvicorn==0.52.4",
  "pyjwt[crypto]==2.13.0",
]

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notron_service"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "notron_service/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
