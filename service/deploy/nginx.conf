# Include inside http {} on the owner's TLS termination proxy.
# Substitute the approved domain/certificate paths before deployment.
# Trust the directly connected peer only. Do not enable real_ip_header for arbitrary clients.
limit_req_zone $binary_remote_addr zone=notron_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=notron_auth:10m rate=10r/m;
limit_req_status 429;
log_format notron_metadata '$status $request_time';
server {
    listen 443 ssl;
    server_name ${APPROVED_DOMAIN};
    ssl_certificate ${TLS_CERTIFICATE_PATH};
    ssl_certificate_key ${TLS_KEY_PATH};
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    access_log /dev/stdout notron_metadata;
    error_log /dev/stderr crit;
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"code":"rate_limited"}';
    }
    location = /v1/oidc/verify {
        limit_req zone=notron_auth burst=5 nodelay;
        proxy_pass http://notron:8000;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 35s;
    }
    location / {
        limit_req zone=notron_ip burst=20 nodelay;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_pass http://notron:8000;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }
}
