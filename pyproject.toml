[project]
name = "notron"
version = "0.1.0"
description = "A personal AI agent that lives inside Apple Notes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "openai==3.7.0",
    "httpx2==2.12.0",
    "numpy>=1.26",
    "cryptography==50.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
notron = "notron.cli:main"

[project.urls]
Homepage = "https://github.com/m1insights/notron"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["notron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
