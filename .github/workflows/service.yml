name: Managed service and native account tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install local test tooling
        run: |
          python -m pip install uv==0.9.22
          sudo apt-get update
          sudo apt-get install -y postgresql nginx
      - name: Locked service tests with disposable PostgreSQL
        run: service/scripts/test-postgres.sh
      - name: Audit locked runtime dependencies
        run: service/scripts/audit-dependencies.sh
      - name: Scan runtime and deployment source for secrets
        run: service/scripts/audit-secrets.sh
      - name: Validate TLS ingress and spoof-resistant limits
        run: service/scripts/test-ingress.sh
      - name: Verify distribution packaging
        run: uv build --project service --wheel
      - name: Build service container from shared privacy source
        run: |
          docker build -f service/Dockerfile -t notron-service-ci .
          docker run --rm --entrypoint python notron-service-ci -c 'from notron_service.app import create_default_app; from notron_service.store import PostgresStore; assert all(p.is_file() for _, p, _ in PostgresStore._migrations())'
  native-account:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Synthetic account session tests and app build
        working-directory: mac
        run: |
          swift test
          swift build
